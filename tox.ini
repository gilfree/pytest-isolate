# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
requires =
    tox >=4
envlist = py{39,312,313,314}, py314-pytestmain
isolated_build = True

[testenv]
deps =
    !pytestmain: pytest>6.0
    pytestmain: pytest @ git+https://github.com/pytest-dev/pytest@main
    numpy
    pytest-xdist
    pytest-sugar
    pytest-mock
setenv = 
    CUDA_VISIBLE_DEVICES = 0,1
commands = pytest --isolate  --import-mode importlib {posargs:tests} --timeline 

[testenv:lint]
skip_install = true
deps = ruff
commands = ruff check {posargs:.}

[gh]
python =
    3.9 = py39
    3.12 = py312
    3.13 = py313
    3.14 = py314